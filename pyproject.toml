[project]
name = "profile-metrics"
version = "0.1.0"
description = "Generates data-driven GitHub profile metrics."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"scripts/metrics/render.py" = ["E501"]
